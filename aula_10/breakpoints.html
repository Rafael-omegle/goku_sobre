<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breakpoints Bootstrap</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <style>
            div{ border: 2px inset #a200ff}
        </style>
    
</head>
<body>
    <h1> COL SM - small </h1>
    <div class="container text-center">
    <div class="row">
        <div class="col-sm">Coluna 1 sm</div>
        <div class="col-sm">Coluna 2 sm</div>
        <div class="col-sm">Coluna 3 sm</div>
    </div>
</div>
<hr>
   <h1> COL MD - medium </h1>
    <div class="container text-center">
    <div class="row">
        <div class="col-md">Coluna 1 md</div>
        <div class="col-md">Coluna 2 md</div>
        <div class="col-md">Coluna 3 md</div>
    </div>
    </div>
<hr>
  <h1> COL LG - large </h1>
    <div class="container text-center">
    <div class="row">
        <div class="col-lg">Coluna 1 lg</div>
        <div class="col-lg">Coluna 2 lg</div>
        <div class="col-lg">Coluna 3 lg</div>
    </div>
    </div>
    <hr>
      <h1> COL XL - Extra large  </h1>
    <div class="container text-center">
    <div class="row">
        <div class="col-xl">Coluna 1 xl</div>
        <div class="col-xl">Coluna 2 xl</div>
        <div class="col-xl">Coluna 3 xl</div>
    </div>
    </div>
    <hr>
      <h1> COL XXL - X Extra large </h1>
    <div class="container text-center">
    <div class="row">
        <div class="col-xxl">Coluna 1 xxl</div>
        <div class="col-xxl">Coluna 2 xxl</div>
        <div class="col-xxl">Coluna 3 xxl</div>
    </div>
    </div>
</body>
</html>
